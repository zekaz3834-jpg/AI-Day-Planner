<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Day Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f1ff;color:#29243c}header{background:linear-gradient(135deg,#7056d8,#44318f);color:white;text-align:center;padding:32px 16px}header h1{margin:0 0 10px}.container{max-width:1000px;margin:30px auto;padding:26px;background:white;border-radius:20px;box-shadow:0 10px 35px #3220641a}h2{color:#6548c6;margin-top:24px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px;margin:8px 0 4px}input,select{width:100%;padding:12px;border:1px solid #d8d4e5;border-radius:10px;font-size:15px}button{padding:12px 16px;border:0;border-radius:10px;background:#7056d8;color:white;cursor:pointer;font-size:14px}button:hover{background:#533ab7}button:disabled{opacity:.55;cursor:wait}.primary{margin-top:14px}.ai-button{width:100%;margin-top:20px;background:#392c84;font-size:16px}.task{display:flex;gap:12px;align-items:center;padding:13px;margin:9px 0;background:#f5f3ff;border-radius:10px}.task-name{flex:1;overflow-wrap:anywhere}.muted{color:#777189;font-size:13px;margin-top:5px}.done{text-decoration:line-through;opacity:.55}.delete{background:#d95470}.calendar-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-bar h3{margin:0;text-align:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.weekday{text-align:center;font-size:12px;color:#6b6385;padding:8px 0}.day{min-height:68px;background:#f7f5ff;color:#302a4c;border:1px solid #e6e0f6;text-align:left;padding:7px;position:relative}.day.selected{outline:2px solid #7056d8}.day.today{background:#ebe6ff}.day.has-tasks:after{content:'•';position:absolute;bottom:3px;right:9px;color:#7056d8;font-size:22px}.day:disabled{visibility:hidden}.schedule{margin-top:12px;padding:18px;background:#f5f3ff;border-radius:12px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;min-height:70px}.status{font-size:13px;color:#625b77;margin-top:10px}footer{text-align:center;padding:25px;color:#80798c}@media(max-width:650px){.container{margin:12px;padding:16px}.fields{grid-template-columns:1fr}.task{flex-wrap:wrap}.task-name{flex-basis:100%}.day{min-height:48px;padding:4px;font-size:12px}}
</style>
</head>
<body>
<header><h1>AI Day Planner</h1><p>Твій розумний помічник для планування дня</p></header>
<main class="container">
<h2>📝 Додати завдання</h2>
<label for="taskInput">Назва завдання</label><input id="taskInput" maxlength="200" placeholder="Наприклад: Підготуватися до іспиту">
<div class="fields"><div><label for="priority">Пріоритет</label><select id="priority"><option value="Високий">🔴 Високий</option><option value="Середній" selected>🟡 Середній</option><option value="Низький">🟢 Низький</option></select></div><div><label for="taskDate">Дата виконання</label><input type="date" id="taskDate"></div></div>
<div class="fields"><div><label for="reminderTime">Час нагадування (необов'язково)</label><input type="time" id="reminderTime"></div><div><label for="reminderToggle">Сповіщення</label><button id="reminderToggle" type="button">Увімкнути сповіщення</button></div></div>
<button class="primary" onclick="addTask()">+ Додати завдання</button>
<h2>📋 Мої завдання на <span id="selectedDateLabel"></span></h2><div id="taskList"></div>
<h2>🗓️ Календар</h2><div class="calendar-bar"><button type="button" onclick="changeMonth(-1)" aria-label="Попередній місяць">◀</button><h3 id="monthLabel"></h3><button type="button" onclick="changeMonth(1)" aria-label="Наступний місяць">▶</button></div><div id="calendar" class="calendar-grid"></div>
<button id="generateButton" class="ai-button" onclick="generateSchedule()">✨ Створити розклад за допомогою ШІ</button>
<h2>📅 Мій розклад</h2><div id="schedule" class="schedule" aria-live="polite">Виберіть дату, додайте завдання та натисніть кнопку генерації.</div><p id="notificationStatus" class="status"></p>
</main><footer>AI Day Planner — Практична робота №9</footer>
<script>
const STORAGE_KEY='dayPlannerTasksV2';
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=dateKey(new Date());
let selectedDate=today;
let shownMonth=new Date();shownMonth.setDate(1);
let tasks=[];
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.name==='string'&&typeof t.date==='string');}catch(e){console.warn('Не вдалося завантажити завдання',e)}
const $=id=>document.getElementById(id);
$('taskDate').value=today;
function saveTasks(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));}catch(e){console.warn('Не вдалося зберегти завдання',e)}}
function addTask(){const name=$('taskInput').value.trim(),priority=$('priority').value,date=$('taskDate').value,reminder=$('reminderTime').value;if(!name){alert('Введіть назву завдання');return}if(!date){alert('Оберіть дату');return}tasks.push({id:crypto.randomUUID(),name,priority,date,reminder,done:false,notified:false});saveTasks();selectedDate=date;shownMonth=new Date(date+'T12:00:00');shownMonth.setDate(1);$('taskInput').value='';$('reminderTime').value='';renderAll()}
function renderTasks(){const list=$('taskList');list.replaceChildren();$('selectedDateLabel').textContent=new Date(selectedDate+'T12:00:00').toLocaleDateString('uk-UA');const current=tasks.filter(t=>t.date===selectedDate);if(!current.length){const p=document.createElement('p');p.textContent='На цю дату завдань поки немає.';list.append(p);return}current.forEach(task=>{const row=document.createElement('div');row.className='task';const body=document.createElement('div');body.className='task-name';const title=document.createElement('div');title.textContent=task.name;if(task.done)title.classList.add('done');const meta=document.createElement('div');meta.className='muted';meta.textContent=`${task.priority} пріоритет${task.reminder?' · Нагадування '+task.reminder:''}`;body.append(title,meta);const done=document.createElement('button');done.textContent=task.done?'↩ Скасувати':'✓ Виконано';done.onclick=()=>{task.done=!task.done;saveTasks();renderAll()};const del=document.createElement('button');del.className='delete';del.textContent='Видалити';del.onclick=()=>{tasks=tasks.filter(t=>t.id!==task.id);saveTasks();renderAll()};row.append(body,done,del);list.append(row)})}
function changeMonth(delta){shownMonth.setMonth(shownMonth.getMonth()+delta);renderCalendar()}
function selectDate(date){selectedDate=date;$('taskDate').value=date;$('schedule').textContent='Натисніть кнопку генерації, щоб створити розклад на обрану дату.';renderAll()}
function renderCalendar(){const y=shownMonth.getFullYear(),m=shownMonth.getMonth();$('monthLabel').textContent=shownMonth.toLocaleDateString('uk-UA',{month:'long',year:'numeric'});const root=$('calendar');root.replaceChildren();['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].forEach(d=>{const el=document.createElement('div');el.className='weekday';el.textContent=d;root.append(el)});const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const blank=document.createElement('div');root.append(blank)}for(let day=1;day<=days;day++){const key=dateKey(new Date(y,m,day));const b=document.createElement('button');b.className='day';if(key===today)b.classList.add('today');if(key===selectedDate)b.classList.add('selected');if(tasks.some(t=>t.date===key))b.classList.add('has-tasks');b.textContent=String(day);b.title=`${key}: ${tasks.filter(t=>t.date===key).length} завдань`;b.onclick=()=>selectDate(key);root.append(b)}}
function renderAll(){renderTasks();renderCalendar()}
async function generateSchedule(){const pending=tasks.filter(t=>t.date===selectedDate&&!t.done),box=$('schedule'),button=$('generateButton');if(!pending.length){box.textContent='Спочатку додайте невиконані завдання на обрану дату.';return}box.textContent='⏳ Gemini створює розклад...';button.disabled=true;try{const response=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tasks:pending})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Помилка сервера');box.textContent=`Дата: ${selectedDate}\n\n${data.schedule||'Gemini не повернув розклад'}`}catch(error){box.textContent='❌ '+error.message}finally{button.disabled=false}}
$('reminderToggle').onclick=async()=>{if(!('Notification' in window)){$('notificationStatus').textContent='Цей браузер не підтримує сповіщення.';return}if(!window.isSecureContext){$('notificationStatus').textContent='Сповіщення потребують HTTPS або localhost.';return}const permission=await Notification.requestPermission();$('notificationStatus').textContent=permission==='granted'?'Сповіщення дозволено. Нагадування працюють, поки ця сторінка відкрита.':'Сповіщення не дозволено.'};
function checkReminders(){if(!('Notification' in window)||Notification.permission!=='granted')return;const now=new Date(),key=dateKey(now),clock=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;let changed=false;for(const task of tasks){if(!task.done&&!task.notified&&task.date===key&&task.reminder&&task.reminder<=clock){new Notification('AI Day Planner',{body:task.name});task.notified=true;changed=true}}if(changed)saveTasks()}
setInterval(checkReminders,15000);renderAll();checkReminders();
</script>
</body>
</html>
